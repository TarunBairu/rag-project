services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: rag_api_service
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      - APP_NAME=RAG-Project
      - APP_ENV=production
      - DATABASE_URL=postgresql://rag_user:rag_password@postgres:5432/rag_db
      - VECTOR_STORE_DIR=/app/data/vector_store
      - EMBEDDING_PROVIDER=mock
      - LLM_PROVIDER=mock
      - LOG_LEVEL=INFO
    volumes:
      - ../data:/app/data
      - ../app/logs:/app/app/logs
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg16
    container_name: rag_postgres_db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=rag_db
      - POSTGRES_USER=rag_user
      - POSTGRES_PASSWORD=rag_password
    ports:
      - "5432:5432"
    volumes:
      - rag_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag_user -d rag_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  rag_postgres_data:
